<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Password Generator | SmartTools Hub</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="navbar">

<div class="logo">
<span class="logo-icon">🛠️</span>

<div>
<h1>SmartTools Hub</h1>
<p>Free Online Tools</p>
</div>

</div>

<a href="index.html" class="btn">🏠 Home</a>

</div>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-H5BVJY3GXS"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-H5BVJY3GXS');
</script>
</header>

<section class="hero">

<h1>🔐 Password Generator</h1>

<p>Create strong and secure passwords instantly.</p>

<div class="calculator-card">

<label>Password Length</label>

<input
type="number"
id="length"
min="8"
max="64"
value="12"
>

<label>
<input type="checkbox" id="uppercase" checked>
Uppercase Letters
</label>

<label>
<input type="checkbox" id="lowercase" checked>
Lowercase Letters
</label>

<label>
<input type="checkbox" id="numbers" checked>
Numbers
</label>

<label>
<input type="checkbox" id="symbols" checked>
Symbols
</label>

<button class="btn" onclick="generatePassword()">
Generate Password
</button>

<input
type="text"
id="passwordOutput"
readonly
placeholder="Your password will appear here"
>

<button class="btn" onclick="copyPassword()">
📋 Copy Password
</button>

</div>

</section>

<script src="script.js"></script>

</body>
</html>
